  :root{
    --white:#ffffff;
    --ink:#0f2e2b;
    --text:#4f6461;
    --soft:#8a9a98;
    --teal:#1DB3A3;
    --teal-d:#0f7f74;
    --line:#e3eceb;
    --ease:cubic-bezier(.65,0,.35,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--white);
    color:var(--ink);
    font-family:"Vazirmatn",Tahoma,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    border-top:3px solid var(--teal);
  }

  main{
    margin:auto;
    width:100%;
    max-width:640px;
    padding:clamp(40px,8vh,72px) max(20px,env(safe-area-inset-right)) 32px max(20px,env(safe-area-inset-left));
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- لوگو ---------- */
  .logo-btn{
    display:block;border:0;background:none;cursor:pointer;padding:6px;border-radius:12px;
    margin-bottom:clamp(36px,7vh,60px);
  }
  .logo-btn:focus-visible{outline:2px solid var(--teal);outline-offset:6px}
  .logo{display:block;width:clamp(210px,58vw,330px);height:auto;overflow:visible}
  .logo .st0{fill:#1DB3A3}
  .logo .st1{fill:#CBCCCB}
  .logo .st2{fill:none;stroke:#1DB3A3;stroke-width:6;stroke-miterlimit:10;stroke-linejoin:round}
  .logo .cover{fill:var(--white);opacity:0}
  .logo .pen{fill:var(--teal);opacity:0}

  /* موشن لوگو */
  .js .logo.play .st2{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .1s var(--ease) forwards}
  .js .logo.play .st1{opacity:0;transform-box:fill-box;transform-origin:50% 100%;
    animation:rise .55s .75s cubic-bezier(.2,.9,.25,1.25) forwards}
  .js .logo.play .cover{opacity:1;transform-box:fill-box;transform-origin:0 50%;
    animation:wipe 1s .85s var(--ease) forwards}
  .js .logo.play .pen{animation:pen 1s .85s var(--ease) forwards}

  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px) scaleY(.4)}to{opacity:1;transform:none}}
  @keyframes wipe{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  @keyframes pen{
    0%{opacity:1;transform:translateX(0)}
    88%{opacity:1}
    100%{opacity:0;transform:translateX(-293px)}
  }

  /* ---------- متن ---------- */
  h1{
    font-size:clamp(26px,6.6vw,40px);
    font-weight:800;
    line-height:1.4;
    color:var(--ink);
    margin-bottom:clamp(10px,2vh,16px);
  }
  .message{
    font-size:clamp(16px,4.2vw,19px);
    font-weight:400;
    line-height:2.05;
    color:var(--text);
    max-width:28em;
    text-wrap:balance;
  }
  .message .ph{white-space:nowrap}
  .message b{font-weight:700;color:var(--ink)}

  /* ---------- شماره ---------- */
  .phone{margin-top:clamp(30px,6vh,48px);display:flex;flex-direction:column;align-items:center;width:100%}
  .phone::before{content:"";display:block;width:36px;height:2px;border-radius:2px;background:var(--teal);margin-bottom:clamp(18px,3.4vh,26px)}
  .number{
    direction:ltr;unicode-bidi:isolate;white-space:nowrap;
    font-size:clamp(34px,10.4vw,56px);
    font-weight:800;
    line-height:1.15;
    letter-spacing:.02em;
    color:var(--ink);
  }

  .actions{
    margin-top:clamp(20px,3.6vh,28px);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    width:100%;
    max-width:400px;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:52px;padding:0 14px;border-radius:12px;
    font:inherit;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;
    transition:background-color .2s,border-color .2s,color .2s;
  }
  .btn svg{width:19px;height:19px;flex:none}
  .btn-call{background:var(--teal-d);color:#fff;border:1px solid var(--teal-d)}
  .btn-call:hover{background:#0b6a61;border-color:#0b6a61}
  .btn-copy{background:var(--white);color:var(--ink);border:1px solid #cfdcda}
  .btn-copy:hover{border-color:var(--teal-d);color:var(--teal-d)}
  .btn-copy.done{border-color:var(--teal);color:var(--teal-d);background:#f1faf8}
  .btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  .btn-copy .i-check{display:none}
  .btn-copy.done .i-copy{display:none}
  .btn-copy.done .i-check{display:block}

  footer{
    padding:22px 20px max(22px,env(safe-area-inset-bottom));
    text-align:center;
    font-size:13.5px;
    color:var(--soft);
  }

  /* ورود متن، بعد از موشن لوگو */
  .js .seq{opacity:0;animation:fade .7s ease forwards}
  .js .s1{animation-delay:1.35s}
  .js .s2{animation-delay:1.5s}
  .js .s3{animation-delay:1.65s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media (max-width:359px){
    .actions{grid-template-columns:1fr}
  }
  @media (min-width:900px){
    main{max-width:720px}
  }
  @media (prefers-reduced-motion:reduce){
    .js .logo.play .st2,.js .logo.play .st1,.js .logo.play .cover,.js .logo.play .pen,.js .seq{animation:none!important}
    .js .logo.play .st2{stroke-dashoffset:0}
    .js .logo.play .st1{opacity:1}
    .js .logo.play .cover,.js .logo.play .pen{opacity:0}
    .js .seq{opacity:1}
  }
</style>

<script>
  (function(){
    /* کپی شماره */
    var num = "02537713740";
    var btn = document.getElementById("copyBtn");
    var label = document.getElementById("copyLabel");
    var t;
    function done(){
      btn.classList.add("done"); label.textContent = "کپی شد";
      clearTimeout(t);
      t = setTimeout(function(){ btn.classList.remove("done"); label.textContent = "کپی شماره"; }, 2000);
    }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = num; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){}
      document.body.removeChild(ta);
    }
    btn.addEventListener("click", function(){
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(num).then(done, fallback);
      } else { fallback(); }
    });

    /* پخش دوباره موشن لوگو با کلیک */
    var logo = document.getElementById("logo");
    document.getElementById("logoBtn").addEventListener("click", function(){
      logo.classList.remove("play");
      void logo.getBoundingClientRect();
      logo.classList.add("play");
    });
  })();
</script>
